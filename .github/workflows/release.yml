name: Release Automático (SemVer)

on:
  push:
    branches:
      - main

jobs:
  test_and_release:
    name: Verificación de Reglas y Publicación de Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para crear tags y releases

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias del motor cuantitativo
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar Suite de Verificación de Reglas FundedNext
        run: |
          python test_verification.py

      - name: Bumping version and push tag (Generar Tag Automático SemVer)
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch # Incremento por defecto si no hay prefijo Conventional Commit
          release_branches: main

      - name: Crear GitHub Release con Changelog Automático
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
